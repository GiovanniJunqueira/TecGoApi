spring.application.name=tech_go_api

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

jwt.secret=${JWT_SECRET}
jwt.access.token.duration.minutes=${JWT_ACCESS_TOKEN_DURATION_MINUTES:15}
jwt.refresh.token.duration.days=${JWT_REFRESH_TOKEN_DURATION_DAYS:7}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.cache.type=redis
spring.data.redis.url=${REDIS_URL}
spring.cache.redis.time-to-live=300000
spring.cache.redis.cache-null-values=false
spring.cache.redis.use-key-prefix=true
spring.cache.redis.key-prefix=techgo

minio.url=${MINIO_URL}
minio.endpoint=${MINIO_URL}
minio.access-key=${MINIO_ACCESS_KEY}
minio.secret-key=${MINIO_SECRET_KEY}
minio.bucketName=${MINIO_BUCKET}
minio.port=${MINIO_PORT:443}
minio.use-ssl=${MINIO_USE_SSL:true}

logging.level.org.springframework.cache=WARN
logging.level.org.springframework.data.redis=WARN
