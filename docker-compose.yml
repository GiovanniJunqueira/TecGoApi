
services:
  postgres:
    image: postgres:latest
    container_name: Tech_go_api_db
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: Tech_go_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456789

  redis:
    image: redis:latest
    container_name: Tech_go_api_redis
    ports:
      - '6379:6379'
    restart: always

  minio:
    image: minio/minio
    container_name: Tech_go_api_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

volumes:
  minio_data:
